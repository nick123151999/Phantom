# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# Configure JVM memory for better performance (2025 standards)
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Enable configuration cache (Gradle 8+)
org.gradle.configuration-cache=false

# Enable daemon for faster builds
org.gradle.daemon=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable unnecessary build features
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# Modern build optimizations
android.experimental.lint.missingBaselineIsEmptyBaseline=true
android.suppressUnsupportedCompileSdk=36

# Kotlin optimizations (if using Kotlin in future)
kotlin.incremental=true
kotlin.caching.enabled=true

# R8 optimizations
android.enableR8.fullMode=true