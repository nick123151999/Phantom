/**
 * Maven Publish Plugin Configuration
 * 替代已废弃的 Bintray 发布插件
 * 
 * 使用方法:
 * 1. 发布到本地 Maven 仓库: ./gradlew publishToMavenLocal
 * 2. 发布到远程仓库: ./gradlew publish
 * 
 * 配置远程仓库 URL 和凭证:
 * 在项目根目录的 local.properties 或 ~/.gradle/gradle.properties 中添加:
 * 
 * maven.url=https://your-maven-repo.com/releases
 * maven.username=your_username
 * maven.password=your_password
 */

apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.wlqq.phantom'
                artifactId = POM_ARTIFACT_ID
                version = POM_VERSION_NAME
                
                // 根据项目类型选择不同的发布方式
                if (project.plugins.hasPlugin('com.android.library')) {
                    // Android Library - AGP 8+ 需要在 afterEvaluate 中访问 components
                    afterEvaluate {
                        from components.findByName('release')
                    }
                } else if (project.plugins.hasPlugin('java')) {
                    // Java Library
                    from components.java
                } else if (project.plugins.hasPlugin('groovy')) {
                    // Groovy Plugin
                    from components.java
                }

                pom {
                    name = POM_ARTIFACT_ID
                    description = POM_DESC
                    url = 'https://github.com/ManbangGroup/Phantom'
                    
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'manbanggroup'
                            name = 'Manbang Group'
                            email = 'opensource@manbanggroup.com'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:git://github.com/ManbangGroup/Phantom.git'
                        developerConnection = 'scm:git:ssh://github.com/ManbangGroup/Phantom.git'
                        url = 'https://github.com/ManbangGroup/Phantom'
                    }
                }
            }
        }

        repositories {
            // 本地 Maven 仓库 (默认 ~/.m2/repository)
            mavenLocal()

            // 远程 Maven 仓库 (可选)
            // 从 local.properties 或 gradle.properties 读取配置
            def mavenUrl = project.findProperty('maven.url')
            def mavenUsername = project.findProperty('maven.username')
            def mavenPassword = project.findProperty('maven.password')

            if (mavenUrl) {
                maven {
                    name = 'CustomMaven'
                    url = mavenUrl
                    
                    if (mavenUsername && mavenPassword) {
                        credentials {
                            username = mavenUsername
                            password = mavenPassword
                        }
                    }
                }
            }
        }
    }
}

// 便捷任务：发布所有模块到本地
task publishAllToMavenLocal {
    group = 'publishing'
    description = 'Publish all Phantom modules to Maven Local'
    
    dependsOn ':phantom-host-lib:publishToMavenLocal'
    dependsOn ':phantom-plugin-lib:publishToMavenLocal'
    dependsOn ':phantom-communication-lib:publishToMavenLocal'
    dependsOn ':phantom-gradle-plugin:publishToMavenLocal'
    dependsOn ':maven-version:publishToMavenLocal'
}

// 便捷任务：发布所有模块到远程仓库
task publishAll {
    group = 'publishing'
    description = 'Publish all Phantom modules to remote Maven repository'
    
    dependsOn ':phantom-host-lib:publish'
    dependsOn ':phantom-plugin-lib:publish'
    dependsOn ':phantom-communication-lib:publish'
    dependsOn ':phantom-gradle-plugin:publish'
    dependsOn ':maven-version:publish'
}

