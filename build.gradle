// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Version configuration - Updated to latest versions (Jan 2026)
ext {
    androidVersion = [
            androidGradlePlugin: "8.13.0",     // Latest AGP (compatible with Gradle 9.2.1)
            compileSdk         : 36,            // Android 16
            buildTools         : "36.0.0",      // Latest Build Tools (matches compileSdk)
            minSdk             : 24,            // Android 7.0 (recommended minimum)
            targetSdk          : 36,            // Android 16
    ]

    androidxVersion = [
            appcompat       : "1.7.0",          // Latest stable
            core            : "1.15.0",         // Latest stable
            recyclerview    : "1.4.0",          // Updated
            constraintlayout: "2.2.0",          // Latest stable
            lifecycle       : "2.8.7",          // Latest stable
            multidex        : "2.0.1",          // Latest stable
            viewpager       : "1.1.0",          // Updated
            legacySupport   : "1.0.0",          // Latest stable
            fragment        : "1.8.5",          // Latest stable
    ]

    phantomVersion = [
            hostLib         : "3.1.3",
            hostLibInt      : 30103,
            pluginLib       : "3.1.2",
            pluginGradle    : "3.1.3",
            communicationLib: "3.1.2",
    ]

    testVersion = [
            junit           : "4.13.2",         // Latest stable
            androidxJunit   : "1.2.1",          // Latest stable
            espresso        : "3.6.1",          // Latest stable
    ]
}

buildscript {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google/'
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // Phantom Gradle Plugin - 已修复 AGP 8+ 兼容性
        classpath 'com.wlqq.phantom:phantom-gradle-plugin:3.1.3'

        // NOTE: Bintray 已废弃，已替换为 Maven Publish Plugin
        // classpath 'com.novoda:bintray-release:0.9'

        // NOTE: OkCheck 插件已过时，暂时禁用
        // classpath 'com.liulishuo.okcheck:gradle:0.2.8'
    }
}

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google/'
        }
        google()
        mavenCentral()
    }

    tasks.withType(Javadoc) {
        options {
            encoding 'UTF-8'
            charSet 'UTF-8'
            links 'http://docs.oracle.com/javase/7/docs/api'
        }
    }

    // NOTE: OkCheck 插件已过时，暂时禁用
    // apply plugin: 'okcheck'

    // 统一 Kotlin stdlib 版本，解决依赖冲突
    // 多个第三方库可能引入不同版本的 Kotlin stdlib，导致 duplicate class 错误
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
        }
    }
}

subprojects { subProject ->
    subProject.tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).all { enabled = false }

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion androidVersion.compileSdk
                buildToolsVersion androidVersion.buildTools

                defaultConfig {
                    minSdkVersion androidVersion.minSdk
                    targetSdkVersion androidVersion.targetSdk
                }

                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }

                packagingOptions {
                    exclude 'META-INF/LGPL2.1'
                    exclude 'META-INF/LICENSE'
                    exclude 'META-INF/LICENSE.txt'
                    exclude 'META-INF/NOTICE'
                    exclude 'META-INF/NOTICE.txt'
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }
    }
}
