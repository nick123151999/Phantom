// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Version configuration
ext {
    androidVersion = [
            androidGradlePlugin: "8.13.2",
            compileSdk         : 36,
            buildTools         : "35.0.0",
            minSdk             : 24,
            targetSdk          : 36,
    ]

    androidxVersion = [
            appcompat       : "1.7.0",
            core            : "1.15.0",
            recyclerview    : "1.3.2",
            constraintlayout: "2.2.0",
            lifecycle       : "2.8.7",
            multidex        : "2.0.1",
            viewpager       : "1.0.0",
            legacySupport   : "1.0.0",
    ]

    phantomVersion = [
            hostLib         : "3.1.3",
            hostLibInt      : 30103,
            pluginLib       : "3.1.2",
            pluginGradle    : "3.1.3",
            communicationLib: "3.1.2",
    ]

    testVersion = [
            junit           : "4.13.2",
            androidxJunit   : "1.2.1",
            espresso        : "3.6.1",
    ]
}

buildscript {
    repositories {
//        mavenLocal()
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google/'
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // Phantom Gradle Plugin - 已修复 AGP 8+ 兼容性
        classpath 'com.wlqq.phantom:phantom-gradle-plugin:3.1.3'

        // NOTE: Bintray 已废弃，已替换为 Maven Publish Plugin
        // classpath 'com.novoda:bintray-release:0.9'

        // NOTE: OkCheck 插件已过时，暂时禁用
        // classpath 'com.liulishuo.okcheck:gradle:0.2.8'
    }
}

allprojects {
    repositories {
//        mavenLocal()
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google/'
        }
        google()
        mavenCentral()
    }

    tasks.withType(Javadoc) {
        options {
            encoding 'UTF-8'
            charSet 'UTF-8'
            links 'http://docs.oracle.com/javase/7/docs/api'
        }
    }

    // NOTE: OkCheck 插件已过时，暂时禁用
    // apply plugin: 'okcheck'

    // 统一 Kotlin stdlib 版本，解决依赖冲突
    // 多个第三方库可能引入不同版本的 Kotlin stdlib，导致 duplicate class 错误
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        }
    }
}

subprojects { subProject ->
    subProject.tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).all { enabled = false }

    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion androidVersion.compileSdk
                buildToolsVersion androidVersion.buildTools

                defaultConfig {
                    minSdkVersion androidVersion.minSdk
                    targetSdkVersion androidVersion.targetSdk
                }

                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }

                packagingOptions {
                    exclude 'META-INF/LGPL2.1'
                    exclude 'META-INF/LICENSE'
                    exclude 'META-INF/LICENSE.txt'
                    exclude 'META-INF/NOTICE'
                    exclude 'META-INF/NOTICE.txt'
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
            }
        }
    }
}
