apply plugin: 'com.android.library'

android {
    compileSdkVersion = androidVersion.compileSdk
    buildToolsVersion = androidVersion.buildTools
    namespace = 'com.wlqq.phantom.library'

    defaultConfig {
        minSdkVersion androidVersion.minSdk

        consumerProguardFiles 'consumer-proguard-rules.pro'

        // Add VERSION_NAME and VERSION_CODE to BuildConfig
        buildConfigField "String", "VERSION_NAME", "\"${phantomVersion.hostLib}\""
        buildConfigField "int", "VERSION_CODE", "${phantomVersion.hostLibInt}"
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // AndroidX dependencies
    implementation "androidx.core:core:${androidxVersion.core}"
    implementation "androidx.appcompat:appcompat:${androidxVersion.appcompat}"
    implementation "androidx.collection:collection:1.5.0" // Added for ArrayMap/ArraySet
    implementation "androidx.fragment:fragment:1.8.9" // Added for Fragment support
    implementation "androidx.preference:preference:1.2.1" // Added for PreferenceFragment support

    // 使用项目依赖
    implementation project(':maven-version')
    implementation project(':phantom-communication-lib')
}
