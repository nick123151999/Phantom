apply plugin: 'com.android.library'

android {
    compileSdkVersion androidVersion.compileSdk
    buildToolsVersion androidVersion.buildTools
    namespace 'com.wlqq.phantom.library'

    defaultConfig {
        minSdkVersion androidVersion.minSdk

        consumerProguardFiles 'consumer-proguard-rules.pro'

        // Add VERSION_NAME and VERSION_CODE to BuildConfig
        buildConfigField "String", "VERSION_NAME", "\"${phantomVersion.hostLib}\""
        buildConfigField "int", "VERSION_CODE", "${phantomVersion.hostLibInt}"
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

}

dependencies {
    testImplementation "junit:junit:${testVersion.junit}"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // AndroidX dependencies
    implementation "androidx.core:core:${androidxVersion.core}"
    implementation "androidx.appcompat:appcompat:${androidxVersion.appcompat}"
    implementation "androidx.collection:collection:1.4.0" // Added for ArrayMap/ArraySet
    implementation "androidx.fragment:fragment:1.8.0" // Added for Fragment support
    implementation "androidx.preference:preference:1.2.1" // Added for PreferenceFragment support

    implementation "com.wlqq.phantom:maven-version:1.1.0"
    implementation "com.wlqq.phantom:phantom-communication-lib:${phantomVersion.communicationLib}"
}

ext {
    POM_ARTIFACT_ID = 'phantom-host-lib'
    POM_VERSION_NAME = phantomVersion.hostLib
    POM_DESC = 'phantom host core library'
}

// Use Maven Publish Plugin instead of deprecated Bintray
apply from: file("${rootDir}/buildscript/publish_maven.gradle")