apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // 使用 Android SDK 4.1.1.4（这是 com.google.android:android 的最新版本）
    // 注意：这个依赖已经过时，但对于纯 Java 库仍然适用
    compileOnly 'com.google.android:android:4.1.1.4'
}

ext {
    POM_ARTIFACT_ID = 'phantom-plugin-lib'
    POM_VERSION_NAME = phantomVersion.pluginLib
    POM_DESC = 'phantom plugin library'
}

// Use Maven Publish Plugin instead of deprecated Bintray
apply from: file("${rootDir}/buildscript/publish_maven.gradle")