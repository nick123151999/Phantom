apply plugin: 'com.android.application'
// Phantom 插件 Gradle 插件 - 已修复 AGP 8+ 兼容性
// 暂时禁用插件以避免 Gradle 缓存问题
// apply plugin: 'com.wlqq.phantom.plugin'

android {
    compileSdkVersion = androidVersion.compileSdk
    buildToolsVersion = androidVersion.buildTools
    namespace = appConfig.pluginComponentId

    defaultConfig {
        applicationId appConfig.pluginComponentId
        minSdkVersion androidVersion.minSdk
        targetSdkVersion androidVersion.targetSdk
        versionCode appConfig.pluginComponentVersionCode
        versionName appConfig.pluginComponentVersion

        multiDexEnabled = true
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFile 'proguard-phantom.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFile 'proguard-phantom.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${variant.applicationId}_${variant.versionName}.apk"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Enable non-transitive R classes to make R.id constants
    androidResources {
        generateLocaleConfig = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // 使用项目依赖
    compileOnly project(':phantom-communication-lib')
    compileOnly project(':phantom-plugin-lib')
    compileOnly project(':phantom-host-lib')

    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // AndroidX dependencies
    implementation "androidx.appcompat:appcompat:${androidxVersion.appcompat}"
    implementation "androidx.core:core:${androidxVersion.core}"
    implementation "androidx.legacy:legacy-support-v4:${androidxVersion.legacySupport}"
    implementation "androidx.viewpager:viewpager:${androidxVersion.viewpager}"
    implementation "androidx.fragment:fragment:${androidxVersion.fragment}"
    implementation "com.google.android.material:material:1.12.0"
    
    implementation 'io.github.shaobin0604:awesomelog:1.0.1'

    // https://mvnrepository.com/artifact/io.reactivex.rxjava2/rxandroid
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    // https://mvnrepository.com/artifact/com.squareup.retrofit2/retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    // https://mvnrepository.com/artifact/io.netty/netty-all
    implementation 'io.netty:netty-all:4.1.34.Final'
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-compress
    implementation 'org.apache.commons:commons-compress:1.28.0'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-math3
    implementation 'org.apache.commons:commons-math3:3.6.1'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-text
    implementation 'org.apache.commons:commons-text:1.15.0'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-pool2
    implementation 'org.apache.commons:commons-pool2:2.12.0'

    testImplementation "junit:junit:${testVersion.junit}"
}

def deletePluginInHost() {
    println "deletePluginInHost..."
    def assetsDir = file(project(':phantom-sample:host').getProjectDir().absolutePath + '/src/main/assets/plugins')
    if (!assetsDir.exists()) {
        assetsDir.mkdirs()
    }
    assetsDir.eachFile { file ->
        println "list assets file: " + file.name
        if (file.name.startsWith(android.defaultConfig.applicationId)) {
            def ret = file.delete()
            println "delete assets file: ${file.name}, result: ${ret}"
        }
    }
}

def copyPluginToHost(String dir) {
    println "copy build plugin to app assets..."
    copy {
        from(buildDir.absolutePath + '/outputs/apk/' + dir) {
            include('*.apk')
        }

        into(project(':phantom-sample:host').getProjectDir().absolutePath + '/src/main/assets/plugins/')
    }
}

afterEvaluate { project ->
    // AGP 8+ compatible: use findByName instead of direct property access
    def assembleDebugTask = project.tasks.findByName('assembleDebug')
    if (assembleDebugTask) {
        assembleDebugTask.doLast {
            deletePluginInHost()
            copyPluginToHost('debug')
        }
    }

    def assembleReleaseTask = project.tasks.findByName('assembleRelease')
    if (assembleReleaseTask) {
        assembleReleaseTask.doLast {
            deletePluginInHost()
            copyPluginToHost('release')
        }
    }
}

// Phantom plugin configuration - AGP 8+ compatible
