apply plugin: 'com.android.application'
/** Phantom 框架宿主 Gradle 插件 - 已修复 AGP 8+ 兼容性 */
// 暂时禁用插件以避免 Gradle 缓存问题
// apply plugin: 'com.wlqq.phantom.host'

android {
    compileSdkVersion = androidVersion.compileSdk
    buildToolsVersion = androidVersion.buildTools
    namespace = appConfig.hostApplicationId
    
    defaultConfig {
        applicationId appConfig.hostApplicationId
        minSdkVersion androidVersion.minSdk
        targetSdkVersion androidVersion.targetSdk
        versionCode appConfig.hostVersionCode
        versionName appConfig.hostVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "com.wlqq.phantom:phantom-host-lib:${phantomVersion.hostLib}"
    implementation "com.wlqq.phantom:phantom-communication-lib:${phantomVersion.communicationLib}"

    // AndroidX dependencies
    implementation "androidx.appcompat:appcompat:${androidxVersion.appcompat}"
    implementation "androidx.core:core:${androidxVersion.core}"
    implementation "androidx.recyclerview:recyclerview:${androidxVersion.recyclerview}"
    implementation "androidx.constraintlayout:constraintlayout:${androidxVersion.constraintlayout}"
    implementation "androidx.lifecycle:lifecycle-runtime:${androidxVersion.lifecycle}"
    implementation "androidx.multidex:multidex:${androidxVersion.multidex}"

    implementation 'io.github.shaobin0604:awesomelog:1.0.1'

    testImplementation "junit:junit:${testVersion.junit}"
    androidTestImplementation "androidx.test.ext:junit:${testVersion.androidxJunit}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${testVersion.espresso}"

    implementation 'com.tencent.bugly:crashreport_upgrade:1.1.7'
}

// 使用本地源码构建，而不是使用 Maven 仓库中的版本
// 这样可以直接测试 phantom-host-lib 的最新修改
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module("com.wlqq.phantom:phantom-host-lib:${phantomVersion.hostLib}") using project(":phantom-host-lib")
    }
}